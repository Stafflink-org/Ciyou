# nginx pour les back-offices Ciyou Eats (SPA React/Vite).
#
# HSTS : à activer côté proxy inversé (Coolify/Traefik) qui termine le HTTPS,
# pas ici — nginx sert du HTTP en interne dans le conteneur. Si nginx sert
# directement le HTTPS un jour, ajouter :
#   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# CSP compatible Firebase (Auth/Firestore/Storage/Functions), Google Maps et Stripe.
# 'unsafe-inline' sur style-src : styles injectés par Google Maps (JS API) et
# certaines libs UI ; script-src reste sans 'unsafe-inline'/'unsafe-eval'.
map $host $csp_admin {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://maps.googleapis.com https://js.stripe.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.ggpht.com https://lh3.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.cloudfunctions.net https://*.run.app https://firestore.googleapis.com https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp_admin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # index.html jamais mis en cache : chaque déploiement est visible immédiatement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp_admin always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        try_files $uri =404;
    }

    # Fallback SPA : les routes client renvoient index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp_admin always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        try_files $uri $uri/ /index.html;
    }

    # Assets Vite hashés (contiennent un hash de contenu dans le nom) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;
}
