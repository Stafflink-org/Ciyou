<!doctype html>
<html lang="fr" data-theme="restaurant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1012" />
    <title>Ciyou Eats Restaurant</title>
    <script>
      // Applique le mode clair/sombre avant le premier rendu pour éviter un flash clair
      // (défaut sombre, aligné sur l'identité visuelle du super admin).
      (function () {
        try {
          var stored = window.localStorage.getItem('golink:color-mode');
          if (stored !== 'light') document.documentElement.dataset.mode = 'dark';
        } catch (e) {
          document.documentElement.dataset.mode = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
